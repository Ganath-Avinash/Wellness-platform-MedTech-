<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wellness Platform - Login</title>
    <link rel="icon" href="new.jpeg" >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>🏥 Digital Wellness Platform</h1>
            <p class="subtitle">Track your health, manage appointments, stay well</p>
            
            <div id="loginForm" class="form-container">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button onclick="login()" class="btn-primary">Login</button>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
            </div>

            <div id="signupForm" class="form-container hidden">
                <h2>Create Account</h2>
                <input type="text" id="signupName" placeholder="Full Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required>
                <button onclick="signup()" class="btn-primary">Sign Up</button>
                <p class="toggle-text">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Your Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
